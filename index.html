<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stick2 — motion lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #f3f0e8; color: #222; overflow: hidden;
    font: 12px/1.3 ui-monospace, Menlo, monospace; }
  body { display: grid; grid-template: "top top" auto "stage side" 1fr "help side" auto / 1fr 290px; }
  body.noside { grid-template-columns: 1fr 0; }
  body.noside #side { display: none; }
  select, input, button { font: inherit; }
  #top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: 6px 10px; border-bottom: 1px solid #ddd7cb; }
  #top input[type=number] { width: 64px; }
  #top [hidden] { display: none; }
  #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #side { grid-area: side; overflow: auto; border-left: 1px solid #ddd7cb; padding: 8px; box-sizing: border-box; }
  #side h3 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  #side label { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 4px; margin: 2px 0; }
  #side input[type=range], #side select { width: 100%; }
  #side .v { text-align: right; color: #666; }
  #side button { margin: 0 3px 3px 0; cursor: pointer; }
  #scope { width: 100%; height: 80px; display: block; border: 1px solid #ddd; box-sizing: border-box; }
  #stats { white-space: pre-wrap; color: #888; font-size: 11px; margin: 4px 0 8px; }
  #help { grid-area: help; padding: 4px 10px; color: #999; border-top: 1px solid #ddd7cb; }
</style>
</head>
<body>
<div id="top">
  <select id="mode" title="play: one fight · grid: 3x3 sweep of a variable · gallery: every move looping">
    <option>play</option><option>grid</option><option>gallery</option>
  </select>
  <label id="scenctl">scenario <select id="scen"></select></label>
  <span id="gridctl">
    X <select id="xk"></select> <input id="xlo" type="number" step="any"> → <input id="xhi" type="number" step="any">
    &nbsp; Y <select id="yk"><option value="">—</option></select> <input id="ylo" type="number" step="any"> → <input id="yhi" type="number" step="any">
  </span>
  <span>
    <button id="pause">pause</button> <button id="step">step</button> <button id="restart">restart</button>
    speed <select id="speed"><option>1</option><option>0.5</option><option>0.25</option><option>0.1</option></select>
    <label><input id="loop" type="checkbox" checked> loop</label>
  </span>
</div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="side"><canvas id="scope"></canvas><div id="stats"></div><div id="panel"></div></div>
<div id="help">A/D move · W jump · S crouch · J punch · K kick — J,J,J · K,K · J,K · J,J,K · S+K sweep · run+J dash · air J/K — R restart · P pause · N step · H sidebar · click a grid cell to adopt its values</div>
<script src="src/core.js"></script>
<script src="src/skeleton.js"></script>
<script src="src/fighter.js"></script>
<script src="src/world.js"></script>
<script src="src/brain.js"></script>
<script src="src/lab.js"></script>
</body>
</html>
