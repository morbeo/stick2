<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stick2 — motion lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #f3f0e8; color: #222; overflow: hidden;
    font: 12px/1.3 ui-monospace, Menlo, monospace; }
  body { display: grid; grid-template: "top top" auto "stage side" 1fr "help side" auto / 1fr 300px; }
  body.noside { grid-template-columns: 1fr 0; }
  body.noside #side { display: none; }
  input, button { font: inherit; }
  @font-face { font-family: Icons; src: url(fonts/icons.woff2) format('woff2'); font-display: block; }

  button.wide { display: block; width: 100%; margin: 2px 0; text-align: left; }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .gops { margin-left: auto; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 1px; }
  #side .fold > h3 .gops { flex-wrap: nowrap; flex-shrink: 0; } .fold.shut > h3:not(:hover) .gops { display: none; }
  #side h3 .hidebtn { margin-left: auto; color: #999; } #side h3 .gops + .hidebtn { margin-left: 2px; } #side h3:not(:hover) .hidebtn { visibility: hidden; }
  .stagehead > b { margin-right: 6px; }
  button.mini { padding: 0 2px; font-size: 11px; line-height: 16px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 3px 0; } .bar.col { flex-direction: column; align-items: stretch; }
  #top { grid-area: top; padding: 4px 10px; border-bottom: 1px solid #ddd7cb; }
  .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; margin: 2px 0; }
  #modes { margin-right: 10px; } #global { margin-left: auto; }

  .grp .gl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #aaa; margin-right: 2px; }
  #top input[type=number] { width: 56px; }
  #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #over { position: absolute; inset: 0; pointer-events: none; }
  #over > * { position: absolute; pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
  .tlbar { left: 8px; bottom: 94px; width: calc(58% - 16px); flex-wrap: nowrap !important; }
  .tlbar .sep { width: 1px; height: 14px; background: #cfc8bb; margin: 0 3px; }
  .tlbar .fd { flex: 1; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #888; font-size: 11px; }
  .tgt { right: 8px; bottom: 6px; max-width: calc(42% - 16px); justify-content: flex-end; }
  .tgt .seg button { padding: 0 5px; font-size: 11px; line-height: 16px; }
  #side { grid-area: side; overflow: auto; border-left: 1px solid #ddd7cb; padding: 8px; box-sizing: border-box; }
  #side h3 { display: flex; align-items: center; margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  .row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 4px; margin: 2px 0; }
  .row input[type=range] { width: 100%; }
  .fold > h3 { cursor: pointer; }
  .fold > h3::before { content: '\e5cf'; font-family: Icons; font-size: 16px; margin: 0 2px 0 -4px; transition: transform .1s; }
  .fold.shut > h3::before { transform: rotate(-90deg); }
  #side:not(.searching) .fold.shut > .fbody, #side:not(.searching) .fold:not(.more) .adv, #side.searching .morebtn { display: none; }
  .morebtn { margin: 2px 0 4px; color: #888; }
  .charpick { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 2px 6px; }
  .charpick canvas { width: 36px; height: 40px; } .charpick .note { margin: 0; } .charpick > span:not(.ic) { flex: 1; display: flex; flex-direction: column; }
  .fpick { display: inline-flex; align-items: center; gap: 4px; } .fpick canvas { width: 20px; height: 22px; }
  .pop .cards { width: 290px; }
  #palette { position: fixed; inset: 0; z-index: 20; background: #0002; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  .pbox { width: min(640px, 90vw); background: #fbfaf6; border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 8px 30px #0003; padding: 8px; }
  .pbox input { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .plist { margin-top: 6px; max-height: 60vh; overflow: auto; }
  .pitem { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .pitem.on { background: #222; color: #fff; } .pitem .pk { width: 64px; flex-shrink: 0; color: #999; font-size: 11px; }
  .pitem .pt { flex: 1; overflow: hidden; text-overflow: ellipsis; color: #999; font-size: 11px; }
  .pitem kbd { font: inherit; font-size: 11px; border: 1px solid #ccc; border-radius: 3px; padding: 0 4px; color: #888; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0; }
  .card { display: flex; flex-direction: column; align-items: center; padding: 2px; font-size: 10px; overflow: hidden; }
  .card canvas { width: 60px; height: 64px; }
  canvas.radar { width: 250px; height: 250px; display: block; margin: 0 auto; }
  #over > .mtable { inset: 0; display: block; overflow: auto; background: #f3f0e8; padding: 8px; }
  .btable td.drag { cursor: grab; } .btable td.dropto { box-shadow: inset 0 3px 0 #c33; }
  #over > .tmat.iso { inset: 50% 0 0 0; border-top: 1px solid #ccc; }
  .tmat table { border-collapse: collapse; } .tmat th.sub { font-weight: normal; color: #777; min-width: 22px; }
  .tmat td.tcell { text-align: center; cursor: pointer; min-width: 22px; color: #555; } .tmat td.tname { white-space: nowrap; }
  .tmat td.pass { background: #e3ecd9; } .tmat td.fail { background: #e9b3a8; color: #8a1d0e; font-weight: bold; } .tmat td.skip { background: #e6e2da; color: #999; }
  .tmat td.on { outline: 2px solid #c33; outline-offset: -2px; }
  #over > .sbuild { inset: auto 0 0 0; max-height: 50%; border-top: 1px solid #ccc; }
  #over > .btable { inset: auto 0 0 0; max-height: 45%; border-top: 1px solid #ccc; }
  .mtable .bar { margin-bottom: 6px; } .mtable .bar input { flex: 1; }
  .mtable table { border-collapse: collapse; font-size: 12px; width: 100%; }
  .mtable th { position: sticky; top: -8px; background: #e8e3d8; text-align: left; padding: 4px 4px; cursor: pointer; white-space: nowrap; font-weight: bold; }
  .mtable td { padding: 2px 4px; border-bottom: 1px solid #e3ded2; white-space: nowrap; }
  .mtable tr:hover td { background: #fbfaf6; cursor: pointer; }
  .mtable tr.on td { background: #222; color: #fff; }
  .mtable td input { width: 46px; font: inherit; background: transparent; border: 1px solid transparent; color: inherit; }
  .mtable td input:hover, .mtable td input:focus { border-color: #bbb; background: #fff; color: #222; }
  .ctable .croot { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #e3ded2; } .ctable .croot > .note { width: 70px; margin: 4px 0 0; }
  .ctable .cnode { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; } .ctable .cnode > .clink { flex-basis: 100%; display: flex; gap: 4px; align-items: flex-start; padding-left: 18px; border-left: 1px solid #cfc8bb; margin-left: 8px; }
  .ctable .chip { font-weight: bold; } .ctable td button.mini + button.mini { margin-left: 2px; } .ctable td .mini:has(+ .mini), .ctable td .chip { margin-right: 2px; } .ctable .warn { color: #c0392b; margin-bottom: 6px; } .ctable td .note { margin: 0; }
  .itable .bar .fill { flex: 1; } .itable .legend { justify-content: flex-start; margin: 2px 0 8px; align-items: center; }
  .itable .legend .key { padding: 1px 8px; border: 1px solid #cfc8bb; border-radius: 3px; font-weight: normal; }
  .pads { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; }
  .pad h4 { margin: 0 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  .pad .grid { display: grid; gap: 2px; }
  .pad button { width: 92px; height: 36px; padding: 1px 3px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; white-space: nowrap; font-size: 11px; line-height: 1.25; }
  .pad button .d { color: #999; font-size: 10px; }
  .itable :is(button, span).set { background: #fbfaf6; }
  .itable :is(button, span).fall { background: repeating-linear-gradient(45deg, #fbf3df 0 4px, #f2e4bf 4px 8px); border-style: dashed; color: #8a6d1c; }
  .itable :is(button, span).none { background: #f6dcd8; border-color: #c0392b; color: #c0392b; }
  .itable :is(button, span).alias { background: transparent; border-style: dotted; color: #aaa; }
  .pad button.cur { outline: 2px solid #222; outline-offset: -1px; font-weight: bold; }
  .itable tr.none td { color: #c0392b; } .itable tr.fall td { color: #8a6d1c; }
  .itable tr.none td:first-child { box-shadow: inset 3px 0 #c0392b; } .itable tr.fall td:first-child { box-shadow: inset 3px 0 #d9b44a; }
  .peek { position: fixed; z-index: 11; pointer-events: none; background: #fbfaf6; border: 1px solid #bbb; border-radius: 4px; padding: 4px; text-align: center; font-size: 11px; font-weight: bold; }
  .peek canvas { width: 120px; height: 128px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: 11px; font-weight: bold; }
  .card.on canvas { filter: invert(1) brightness(1.6); }
  .tree { display: flex; align-items: center; gap: 2px; margin: 1px 0; }
  .tree button { padding: 0 6px; } button.twist, span.twist { width: 18px; padding: 0; border: 0; background: none; }
  .vname { cursor: pointer; text-decoration: underline dotted #aaa; text-underline-offset: 3px; }
  .vname:hover { color: #c0392b; text-decoration: underline solid; } .vname:hover::after { content: '\ea4b'; font-family: Icons; margin-left: 3px; }
  .row > .seg, .row > button { grid-column: 2 / 4; justify-self: start; }
  #side h4 { display: flex; align-items: center; margin: 8px 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  [hidden] { display: none !important; }
  .v { text-align: right; color: #666; }
  #scope { width: 100%; height: 80px; display: block; border: 1px solid #ddd; box-sizing: border-box; }
  .note { white-space: pre-wrap; color: #888; font-size: 11px; margin: 4px 0 8px; }
  #help { grid-area: help; padding: 4px 10px; color: #999; border-top: 1px solid #ddd7cb; }
  .pop { position: fixed; z-index: 10; background: #fbfaf6; border: 1px solid #bbb; border-radius: 4px; padding: 8px;
    box-shadow: 0 4px 16px #0002; max-width: 420px; max-height: 70vh; overflow: auto; }
  .pop p { margin: 6px 0 0; white-space: pre-wrap; color: #444; }
  .pop .keys { color: #888; }
  .dbgpop { width: 360px; } .dbgpop .row .bar { flex-wrap: wrap; }
  .keyspop { width: 340px; } .keyspop .warn > span:first-child, .keyspop .bar.warn > button:first-child { color: #c0392b; }
  input.macro { flex: 1; min-width: 0; font: inherit; font-size: 11px; margin: 0 4px; }
  .pop h4 { display: flex; align-items: center; gap: 4px; margin: 8px 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  #docs { position: fixed; inset: 0; z-index: 15; background: #0002; display: flex; justify-content: center; align-items: center; }
  .dbox { width: min(1100px, 94vw); height: 88vh; background: #fbfaf6; border: 1px solid #bbb; border-radius: 6px; box-shadow: 0 8px 30px #0003; display: flex; overflow: hidden; }
  .dside { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #ddd7cb; padding: 8px; gap: 6px; }
  .dside .bar { flex-wrap: nowrap; } .dside input { flex: 1; min-width: 0; font: inherit; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
  .dtoc { overflow: auto; overflow-x: hidden; } .dtoc .pitem { overflow: hidden; text-overflow: ellipsis; } .dtoc h4 { margin: 8px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #999; }
  .dbody { flex: 1; overflow: auto; padding: 12px 20px; } .dbody h2 { margin: 0 0 8px; font-size: 18px; }
  .dbody p { max-width: 720px; line-height: 1.5; color: #333; } .dbody .bar { margin: 10px 0; align-items: center; }
  .demos { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; } .demo canvas { width: 360px; height: 200px; display: block; border: 1px solid #ddd7cb; border-radius: 4px; }
  .demo .bar { margin: 3px 0; gap: 3px; } .demo b { margin-right: auto; font-size: 11px; }
  .dbody dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; max-width: 900px; font-size: 12px; }
  .dbody dt { font-weight: bold; display: flex; align-items: center; gap: 3px; } .dbody dt.hit { background: #f6e7b0; } .dbody dd { margin: 0; color: #444; } .dbody canvas.ease { display: block; margin: 2px 0; }
  body.docspage { display: block; } body.docspage > :not(#docs, .tip, .pop) { display: none; }
  body.docspage #docs { position: static; background: none; height: 100vh; } body.docspage .dbox { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  .tip { position: fixed; z-index: 20; display: none; pointer-events: none; max-width: 320px; padding: 4px 7px;
    background: #222; color: #f3f0e8; border-radius: 3px; font-size: 11px; white-space: pre-wrap; }
</style>
