# stick2 server on its own: docker compose -f server/docker-compose.yml up -d
# (behind HTTPS: put Caddy or another proxy in front, and set TRUST_PROXY=1; see docs/server.md)
services:
  stick2:
    build: { context: .., dockerfile: server/Dockerfile }
    image: ghcr.io/morbeo/stick2-server:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SERVER_NAME: stick2 server
      MAX_ROOMS: "500"
      # METRICS_TOKEN: change-me
    volumes: [stick2:/data]
    stop_grace_period: 10m # matches finish before a restart (DRAIN_TIMEOUT)
volumes:
  stick2:
