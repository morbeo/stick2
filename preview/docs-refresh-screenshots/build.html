<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stick2 · build</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fafafa; color: #222; }
  main { max-width: 34rem; margin: 12vh auto; padding: 0 16px; }
  input { font: inherit; padding: .4rem .6rem; border: 1px solid #bbb; border-radius: 6px; width: 14rem; }
  button { font: inherit; padding: .4rem .9rem; border: 1px solid #888; border-radius: 6px; background: #fff; cursor: pointer; }
  code { background: #eee; padding: 0 .3rem; border-radius: 4px; }
  .err { color: #b00020; }
</style>
</head>
<body>
<!-- Loads the game as it was at any commit, branch or tag: build.html?sha=<ref>[&page=docs.html][&...the page's own params].
     The page's html comes from jsDelivr's copy of the repo at that commit, with a <base> so its scripts load from there too.
     Saves are a read-only copy: an old build can read your local data but its writes stay in memory, so it can't break the live game. -->
<main id="ui">
  <h1>Load a build</h1>
  <p>Play stick2 as it was at any commit, branch or tag. Your saves are copied in read-only.</p>
  <form id="f"><input id="sha" placeholder="commit, e.g. 14d5a3c" autofocus> <button>Load</button></form>
  <p id="msg"></p>
</main>
<script>
(async () => {
  const REPO = 'morbeo/stick2', q = new URLSearchParams(location.search), ref = (q.get('sha') || '').trim(), page = q.get('page') || 'index.html';
  const msg = (t, err) => { const m = document.getElementById('msg'); m.textContent = t; m.className = err ? 'err' : ''; };
  document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('sha').value.trim(); if (v) { q.set('sha', v); location.search = q; } };
  if (!ref) return;
  if (!/^[\w.\/-]{1,100}$/.test(ref) || !/^[\w-]+\.html$/.test(page)) return msg('That is not a commit id, branch or tag.', true);
  document.getElementById('sha').value = ref;
  msg(`Loading ${ref}…`);
  try {
    // resolve to a full commit (accepts short ids, branches and tags), for a stable cdn url and the build info
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/${encodeURIComponent(ref)}`);
    if (!r.ok) throw new Error(r.status === 404 || r.status === 422 ? `No commit "${ref}" in ${REPO}.` : `GitHub said ${r.status}.`);
    const c = await r.json(), sha = c.sha, base = `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/`;
    const h = await fetch(base + page);
    if (!h.ok) throw new Error(`${page} does not exist at ${sha.slice(0, 7)}.`);
    const build = { commit: sha.slice(0, 7), branch: ref === sha.slice(0, ref.length) ? 'commit' : ref, date: c.commit.committer.date,
      subject: c.commit.message.split('\n')[0].slice(0, 80), dirty: false, built: 'build.html' };
    // src/build.js is generated at deploy, not committed: define BUILD here instead
    const head = `<base href="${base}"><script>${shim}\nvar BUILD = ${JSON.stringify(build)};<\/script>`;
    const html = (await h.text()).replace(/<script src="src\/build\.js[^"]*"><\/script>/, '').replace(/<head[^>]*>/i, m => m + head);
    document.open(); document.write(html); document.close();
  } catch (e) { msg(e.message || String(e), true); }
})();
// localStorage as an in-memory copy, so an old build never overwrites the live game's saves
var shim = `(() => { const m = new Map(); try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); m.set(k, localStorage.getItem(k)); } } catch {}
  const s = { getItem: k => m.has(k) ? m.get(k) : null, setItem: (k, v) => m.set(String(k), String(v)), removeItem: k => m.delete(k), clear: () => m.clear(),
    key: i => [...m.keys()][i] ?? null, get length() { return m.size; } };
  try { Object.defineProperty(window, 'localStorage', { value: s, configurable: true }); } catch {} })();`;
</script>
</body>
</html>
