# stick2 server with its monitoring, all self-hosted: docker compose -f server/docker-compose.full.yml up -d
#   game + relay  http://localhost:8080
#   Prometheus    http://localhost:9090  (alerts in monitoring/alerts.yml)
#   Grafana       http://localhost:3000  (the "stick2 server" dashboard is provisioned; log in admin / GRAFANA_PASSWORD)
services:
  stick2:
    build: { context: .., dockerfile: server/Dockerfile }
    image: ghcr.io/morbeo/stick2-server:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SERVER_NAME: stick2 server
      # METRICS_TOKEN: change-me   (then set the same token in monitoring/prometheus.yml)
      # ADMIN_TOKEN: change-me     (/api/admin/flags lists the matches that didn't add up)
    volumes: [stick2:/data]
    stop_grace_period: 10m
  prometheus:
    image: prom/prometheus:v2.53.2
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/stick2.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  stick2:
  prometheus:
