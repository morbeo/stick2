# alert examples for a stick2 server; the Grafana dashboard shows the same series
groups:
  - name: stick2
    rules:
      - alert: Stick2Down
        expr: up{job="stick2"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "the stick2 server is not answering /metrics" }
      - alert: Stick2DesyncSpike
        expr: sum(increase(stick2_flagged_total{verdict="desync"}[30m])) > 5
        labels: { severity: warn }
        annotations: { summary: "more than 5 matches in 30 min whose replay doesn't add up (tampering, or clients on another build)" }
      - alert: Stick2WrongResults
        expr: sum(increase(stick2_flagged_total{verdict="result"}[1h])) > 0
        labels: { severity: warn }
        annotations: { summary: "a host claimed a winner the fight doesn't give: see /api/admin/flags" }
      - alert: Stick2RttHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(stick2_rtt_seconds_bucket[10m]))) > 0.2
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "round trip p95 above 200 ms for 10 min" }
      - alert: Stick2VerifyBacklog
        expr: stick2_verify_queue > 20
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "finished matches are queuing up to be verified: the server is short of CPU" }
