name: Set up Chrome
description: Installs the pinned Chrome for Testing plus the system libraries it needs on a bare runner. Output chrome-path is the binary.
outputs:
  chrome-path:
    description: Path of the Chrome binary
    value: ${{ steps.chrome.outputs.chrome-path }}
runs:
  using: composite
  steps:
    - name: Set up Chrome
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      with:
        install-dependencies: true # bare ubuntu-latest is missing libnss3 etc. that Chrome for Testing needs to start
