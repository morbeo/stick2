name: Render fight GIF
description: Sets up Node and Chrome, installs dependencies and renders the fight GIF seeded by a commit SHA or release tag.
inputs:
  seed:
    description: Commit SHA or release tag that seeds the fight
    required: true
outputs:
  path:
    description: Path of the rendered GIF
    value: ${{ steps.gif.outputs.path }}
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      id: chrome
      with:
        install-dependencies: true # bare ubuntu-latest is missing libnss3 etc. that Chrome for Testing needs to start
    - name: Render fight GIF
      id: gif
      shell: bash
      env:
        CHROME: ${{ steps.chrome.outputs.chrome-path }}
        SEED: ${{ inputs.seed }}
      run: echo "path=$(node tools/discord/render-notify-gif.js "$SEED")" >> "$GITHUB_OUTPUT"
