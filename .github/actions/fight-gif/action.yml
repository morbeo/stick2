name: Render fight GIF
description: Sets up Node and Chrome, installs dependencies and renders the fight GIF seeded by a commit SHA or release tag.
inputs:
  seed:
    description: Commit SHA or release tag that seeds the fight
    required: true
outputs:
  path:
    description: Path of the rendered GIF
    value: ${{ steps.gif.outputs.path }}
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: ./.github/actions/setup-node
    - name: Set up Chrome
      uses: ./.github/actions/setup-chrome
      id: chrome
    - name: Render fight GIF
      id: gif
      shell: bash
      env:
        CHROME: ${{ steps.chrome.outputs.chrome-path }}
        SEED: ${{ inputs.seed }}
      # a failed render warns (the post still goes out, without the GIF) instead of silently giving an empty path
      run: |
        if gif=$(node tools/discord/render-notify-gif.js "$SEED"); then echo "path=$gif" >> "$GITHUB_OUTPUT"
        else echo "::warning::Fight GIF render failed for $SEED; posting without it"; fi
