name: Discord notify

on:
  push:
    branches: [master]

# Set the repo/org variable DISCORD_NOTIFY_GIF to "false" to skip rendering a fight
# GIF (faster, no Chrome install) and just post the plain embed. Default: on.
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        run: npm ci
      - name: Render a fight GIF
        if: vars.DISCORD_NOTIFY_GIF != 'false'
        id: gif
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "path=$(node tools/render-notify-gif.js)" >> "$GITHUB_OUTPUT"
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "stick2 updated" \
            --arg desc "${{ github.event.head_commit.message }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg author "${{ github.event.head_commit.author.name }}" \
            --arg sha "${{ github.sha }}" \
            --arg ts "${{ github.event.head_commit.timestamp }}" \
            --argjson hasGif "$([ -n "$GIF_PATH" ] && echo true || echo false)" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                author: { name: $author },
                fields: [{ name: "Commit", value: ($sha | .[0:7]), inline: true }],
                timestamp: $ts
              } + (if $hasGif then { image: { url: "attachment://fight.gif" } } else {} end)]
            }')
          if [ -n "$GIF_PATH" ]; then
            curl -s -F "payload_json=$PAYLOAD" -F "files[0]=@${GIF_PATH};filename=fight.gif" "$DISCORD_WEBHOOK"
          else
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          fi
