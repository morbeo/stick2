name: Discord notify

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: write # to attach the gif to a release's assets

# Set the repo/org variable DISCORD_NOTIFY_GIF to "false" to skip rendering a fight
# GIF (faster, no Chrome install) and just post the plain embed. Default: on.
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - if: vars.DISCORD_NOTIFY_GIF != 'false'
        run: npm ci
      - name: Render a fight GIF
        # chars/seed are derived from the commit SHA (or the release tag), so the same fight can be
        # replayed later with: node tools/render-notify-gif.js <sha-or-tag>
        if: vars.DISCORD_NOTIFY_GIF != 'false'
        id: gif
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "path=$(node tools/render-notify-gif.js ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }})" >> "$GITHUB_OUTPUT"
      - name: Attach it to the release
        if: github.event_name == 'release' && steps.gif.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$GIF_PATH#fight.gif" --clobber --repo "${{ github.repository }}"
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
          TITLE: ${{ github.event_name == 'release' && format('stick2 {0} is out!', github.event.release.name || github.event.release.tag_name) || 'Hear ye, hear ye! stick2 updated' }}
          DESC: ${{ github.event_name == 'release' && github.event.release.body || github.event.head_commit.message }}
          URL: ${{ github.event_name == 'release' && github.event.release.html_url || github.event.head_commit.url }}
          AUTHOR: ${{ github.event_name == 'release' && github.event.release.author.login || github.event.head_commit.author.name }}
          FIELD_NAME: ${{ github.event_name == 'release' && 'Release' || 'Commit' }}
          FIELD_VALUE: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          TS: ${{ github.event.head_commit.timestamp }}
        run: |
          # a commit's field is its short SHA; a release's field is already the tag name, left as is
          [ "$GITHUB_EVENT_NAME" = release ] || FIELD_VALUE="${FIELD_VALUE:0:7}"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg fname "$FIELD_NAME" \
            --arg fvalue "$FIELD_VALUE" \
            --arg ts "$TS" \
            --argjson hasGif "$([ -n "$GIF_PATH" ] && echo true || echo false)" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                author: { name: $author },
                fields: [{ name: $fname, value: $fvalue, inline: true }]
              } + (if $ts != "" then { timestamp: $ts } else {} end)
                + (if $hasGif then { image: { url: "attachment://fight.gif" } } else {} end)]
            }')
          if [ -n "$GIF_PATH" ]; then
            curl -s -F "payload_json=$PAYLOAD" -F "files[0]=@${GIF_PATH};filename=fight.gif" "$DISCORD_WEBHOOK"
          else
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          fi
