name: Discord notify

on:
  push:
    branches: [master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - name: Render a fight GIF
        id: gif
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "path=$(node tools/render-notify-gif.js)" >> "$GITHUB_OUTPUT"
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "stick2 updated" \
            --arg desc "${{ github.event.head_commit.message }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg author "${{ github.event.head_commit.author.name }}" \
            --arg sha "${{ github.sha }}" \
            --arg ts "${{ github.event.head_commit.timestamp }}" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                author: { name: $author },
                fields: [{ name: "Commit", value: ($sha | .[0:7]), inline: true }],
                timestamp: $ts,
                image: { url: "attachment://fight.gif" }
              }]
            }')
          curl -s \
            -F "payload_json=$PAYLOAD" \
            -F "files[0]=@${GIF_PATH};filename=fight.gif" \
            "$DISCORD_WEBHOOK"
