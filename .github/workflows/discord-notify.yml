name: Discord · release & master updates
run-name: "${{ github.event_name == 'release' && format('Announce release {0}', github.event.release.tag_name) || format('Announce master update: {0}', github.event.head_commit.message) }}"

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]

permissions:
  contents: write # to attach the gif to a release's assets

concurrency:
  group: discord-notify-${{ github.ref }}
  cancel-in-progress: true

# Set the repo/org variable DISCORD_NOTIFY_GIF to "false" to skip rendering a fight
# GIF (faster, no Chrome install) and just post the plain embed. Default: on.
jobs:
  announce:
    name: Announce on Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WANT_GIF: ${{ vars.DISCORD_NOTIFY_GIF != 'false' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render fight GIF
        # chars/seed are derived from the commit SHA (or the release tag), so the same fight can be
        # replayed later with: node tools/discord/render-notify-gif.js <sha-or-tag>
        if: env.WANT_GIF == 'true'
        id: gif
        uses: ./.github/actions/fight-gif
        with:
          seed: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Attach GIF to release
        if: github.event_name == 'release' && steps.gif.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$GIF_PATH#fight.gif" --clobber --repo "${{ github.repository }}"
      - name: Post embed to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
          TITLE: ${{ github.event_name == 'release' && format('stick2 {0} is out!', github.event.release.name || github.event.release.tag_name) || 'Hear ye, hear ye! stick2 updated' }}
          DESC: ${{ github.event_name == 'release' && github.event.release.body || github.event.head_commit.message }}
          URL: ${{ github.event_name == 'release' && github.event.release.html_url || github.event.head_commit.url }}
          AUTHOR: ${{ github.event_name == 'release' && github.event.release.author.login || github.event.head_commit.author.name }}
          FIELD_NAME: ${{ github.event_name == 'release' && 'Release' || 'Commit' }}
          FIELD_VALUE: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          TS: ${{ github.event.head_commit.timestamp }}
        run: |
          # a commit's field is its short SHA; a release's field is already the tag name, left as is
          [ "$GITHUB_EVENT_NAME" = release ] || FIELD_VALUE="${FIELD_VALUE:0:7}"
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg fname "$FIELD_NAME" \
            --arg fvalue "$FIELD_VALUE" \
            --arg ts "$TS" \
            --argjson hasGif "$([ -n "$GIF_PATH" ] && echo true || echo false)" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                author: { name: $author },
                fields: [{ name: $fname, value: $fvalue, inline: true }]
              } + (if $ts != "" then { timestamp: $ts } else {} end)
                + (if $hasGif then { image: { url: "attachment://fight.gif" } } else {} end)]
            }')
          # --fail-with-body so a Discord-side error (bad webhook, rate limit) fails the job loudly instead of
          # silently; one retry after a couple seconds covers a transient 5xx / rate limit
          send() { if [ -n "$GIF_PATH" ]; then
              curl -sS --fail-with-body -F "payload_json=$PAYLOAD" -F "files[0]=@${GIF_PATH};filename=fight.gif" "$DISCORD_WEBHOOK"
            else
              curl -sS --fail-with-body -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
            fi; }
          send || { echo "::warning::First attempt failed, retrying in 5s"; sleep 5; send; }
          echo "Posted **$TITLE** ($FIELD_NAME \`$FIELD_VALUE\`, GIF: $([ -n "$GIF_PATH" ] && echo yes || echo no)) to Discord" >> "$GITHUB_STEP_SUMMARY"
