name: Pages · deploy & previews
run-name: "${{ github.event_name == 'push' && format('Deploy {0}', github.ref_name) || github.event_name == 'delete' && format('Remove preview {0}', github.event.ref) || 'Pages' }}"

# Publishes the site to the gh-pages branch: master at the root, every other branch
# under preview/<branch>/. Each deploy is recorded as a GitHub deployment (environment
# github-pages for master, preview for branches), so PRs show "View deployment".
# Deleting a branch removes its preview and marks its deployments inactive. Pages source must be "Deploy from a branch: gh-pages / (root)".
on:
  push:
    branches: ['**']
  delete:

permissions: {} # granted per job

concurrency:
  group: pages # one writer to gh-pages at a time
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: write
    environment:
      name: ${{ github.ref_name == 'master' && 'github-pages' || 'preview' }}
      url: ${{ steps.copy.outputs.url }}
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src-repo
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Copy site and push
        id: copy
        run: |
          node src-repo/tools/dev/build-info.js
          # version every script url, so a reload after a deploy never runs old cached scripts with a new page
          sed -i -E "s#(src=\"src/[^\"?]+\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" src-repo/*.html
          slug=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._\n-' '-')
          if [ "$GITHUB_REF_NAME" = master ]; then dest=site; keep=(--exclude preview/); else dest=site/preview/$slug; keep=(); fi
          mkdir -p "$dest"
          rsync -a --delete --exclude .git --exclude .nojekyll "${keep[@]}" \
            --exclude .github --exclude node_modules --exclude tests --exclude tools --exclude out --exclude dist \
            src-repo/ "$dest/"
          cd site && touch .nojekyll
          # -f below: the copied .gitignore lists src/build.js (ignored in the repo), but the site needs it
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}${dest#site}"; url="${url%/}/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          git add -Af && git diff --cached --quiet && { echo "No changes for $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git commit -qm "Deploy $GITHUB_REF_NAME@${GITHUB_SHA::7}" && git push
          echo "Deployed \`$GITHUB_REF_NAME\` to $url" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove branch preview
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Mark preview deployments inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.ref }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview&ref=$BRANCH&per_page=100" --jq '.[].id'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive >/dev/null
          done
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      - name: Delete preview folder and push
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._\n-' '-')
          [ -d "preview/$slug" ] || exit 0
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git rm -rq "preview/$slug" && git commit -qm "Remove preview for $BRANCH" && git push
