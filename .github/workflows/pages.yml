name: Pages · deploy & previews
run-name: "${{ github.event_name == 'push' && format('Deploy {0}', github.ref_name) || github.event_name == 'delete' && format('Remove preview {0}', github.event.ref) || format('Comment preview link on #{0}', github.event.number) }}"

# Publishes the site to the gh-pages branch: master at the root, every other branch
# under preview/<branch>/. A PR gets a comment with its preview link; deleting a
# branch removes its preview. Pages source must be "Deploy from a branch: gh-pages / (root)".
on:
  push:
    branches: ['**']
  delete:
  pull_request:
    types: [opened, reopened]

permissions: {} # granted per job

concurrency:
  group: pages # one writer to gh-pages at a time
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src-repo
      - name: Check out gh-pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: site
      - name: Copy site and push
        run: |
          node src-repo/tools/dev/build-info.js
          slug=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._\n-' '-')
          if [ "$GITHUB_REF_NAME" = master ]; then dest=site; keep=(--exclude preview/); else dest=site/preview/$slug; keep=(); fi
          mkdir -p "$dest"
          rsync -a --delete --exclude .git --exclude .nojekyll "${keep[@]}" \
            --exclude .github --exclude node_modules --exclude tests --exclude tools --exclude out --exclude dist \
            src-repo/ "$dest/"
          cd site && touch .nojekyll
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/${dest#site}"; url="${url%/}/"
          git add -A && git diff --cached --quiet && { echo "No changes for $url" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git commit -qm "Deploy $GITHUB_REF_NAME@${GITHUB_SHA::7}" && git push
          echo "Deployed \`$GITHUB_REF_NAME\` to $url" >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Comment preview link
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post preview link on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._\n-' '-')
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          gh pr comment ${{ github.event.number }} --repo "$GITHUB_REPOSITORY" \
            --body "Preview: https://${owner,,}.github.io/$repo/preview/$slug/ (updates on every push)"

  cleanup:
    name: Remove branch preview
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
      - name: Delete preview folder and push
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._\n-' '-')
          [ -d "preview/$slug" ] || exit 0
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git rm -rq "preview/$slug" && git commit -qm "Remove preview for $BRANCH" && git push
