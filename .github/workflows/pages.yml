name: Pages

# Publishes the site to the gh-pages branch: master at the root, every other branch
# under preview/<branch>/. A PR gets a comment with its preview link; deleting a
# branch removes its preview. Pages source must be "Deploy from a branch: gh-pages / (root)".
on:
  push:
    branches: ['**']
  delete:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages # one writer to gh-pages at a time
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stamp build info and pick a target dir
        id: t
        run: |
          node tools/dev/build-info.js
          rm -rf .github node_modules tests tools out dist
          slug=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._\n-' '-')
          if [ "$GITHUB_REF_NAME" = master ]; then echo "dir=" >> "$GITHUB_OUTPUT"; else echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"; fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: ${{ steps.t.outputs.dir }}
          keep_files: true # keep master's files and other previews
          exclude_assets: '.git'
          enable_jekyll: false

  comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._\n-' '-')
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          gh pr comment ${{ github.event.number }} --repo "$GITHUB_REPOSITORY" \
            --body "Preview: https://${owner,,}.github.io/$repo/preview/$slug/ (updates on every push)"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
      - env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._\n-' '-')
          [ -d "preview/$slug" ] || exit 0
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git rm -rq "preview/$slug" && git commit -qm "Remove preview for $BRANCH" && git push
