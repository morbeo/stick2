name: Discord release notify

on:
  release:
    types: [published]

permissions:
  contents: write # to attach the gif to the release's assets

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - name: Render a fight GIF
        # seeded by the release tag, so the same release always gets the same fight:
        # node tools/render-notify-gif.js <tag> reproduces it later
        id: gif
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "path=$(node tools/render-notify-gif.js ${{ github.event.release.tag_name }})" >> "$GITHUB_OUTPUT"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$GIF_PATH#fight.gif" --clobber --repo "${{ github.repository }}"
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
          TITLE: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          AUTHOR: ${{ github.event.release.author.login }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "stick2 ${TITLE:-$TAG} is out!" \
            --arg url "$URL" \
            --arg desc "${BODY:0:1500}" \
            --arg author "$AUTHOR" \
            --arg tag "$TAG" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                author: { name: $author },
                fields: [{ name: "Release", value: $tag, inline: true }],
                image: { url: "attachment://fight.gif" }
              }]
            }')
          curl -s -F "payload_json=$PAYLOAD" -F "files[0]=@${GIF_PATH};filename=fight.gif" "$DISCORD_WEBHOOK"
