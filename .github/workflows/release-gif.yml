name: Release · attach fight GIF
run-name: "Attach fight GIF to ${{ inputs.tag }}"

# Manual backfill: renders the same fight GIF the Discord workflow makes for a
# published release (seeded by the tag) and attaches it as fight.gif. No Discord post.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the GIF to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write # to attach the gif to the release's assets

jobs:
  attach:
    name: Render and attach GIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null || { echo "::error::No release for tag $TAG"; exit 1; }
      - name: Render fight GIF
        id: gif
        uses: ./.github/actions/fight-gif
        with:
          seed: ${{ inputs.tag }}
      - name: Attach GIF to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIF_PATH: ${{ steps.gif.outputs.path }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" "$GIF_PATH#fight.gif" --clobber --repo "${{ github.repository }}"
          echo "Attached fight.gif to \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
