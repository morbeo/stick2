name: CI · lint, coverage & browser
run-name: "CI on ${{ github.head_ref || github.ref_name }}"

# Every push and PR: unit tests with a line-coverage floor, the server's tests, the headless-Chrome
# smoke test, two-browser netplay (peer to peer, and through the relay server), and a check that src/ has no test-only branches. Raise the floor in tools/dev/coverage-check.js
# (coverage:check) as coverage grows; never lower it to get green.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a new push supersedes the PR's older run

jobs:
  label:
    name: Label PR from its branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write # add the label
      issues: write # create the label the first time
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.head_ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # feat/x → feature, fix/x → fix, docs/ test/ ci/ refactor/ perf/ chore/ → the same word; the release notes group by these (.github/release.yml)
      - name: Label from branch prefix
        run: |
          prefix="${BRANCH%%/*}"
          case "$prefix" in feat) label=feature ;; fix|docs|test|ci|refactor|perf|chore) label=$prefix ;; *) echo "no label for '$prefix/'"; exit 0 ;; esac
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color ededed --description "release notes section" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$label"
  unit:
    name: Unit tests + coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: No test-only branches in src
        run: npm run lint:src
      - name: Build info
        run: node tools/dev/build-info.js
      - name: Unit tests with coverage floor
        run: npm run coverage:check
      - name: Sim perf budget (ms/frame)
        run: npm run perf:check

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run server tests
        run: npm run test:server

  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build info
        run: node tools/dev/build-info.js
      - name: Smoke test in headless Chrome
        run: npm run test:browser
        env:
          CHROME: /usr/bin/google-chrome
      - name: Character editor across a reload
        run: npm run test:editor
        env:
          CHROME: /usr/bin/google-chrome

  netplay:
    name: Two-browser netplay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build info
        run: node tools/dev/build-info.js
      - name: Peer to peer, through the lobby to a synced match
        run: npm run test:netplay
      - name: Through the relay server
        run: npm run test:server-browser
