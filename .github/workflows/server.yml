name: Server · test & image
run-name: "${{ github.event_name == 'release' && format('Server image {0}', github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && 'Server image (manual)' || format('Server tests on {0}', github.ref_name) }}"

# Tests the dedicated server (server/) on every change to it; builds the multi-arch Docker image and pushes it to GHCR
# (ghcr.io/<owner>/stick2-server) on a release or by hand.
on:
  push:
    paths: ["server/**", "src/net/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "src/net/**", ".github/workflows/server.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Run server tests
        run: npm test --prefix server

  image:
    name: Build and push image
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          img="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/stick2-server"
          tags="$img:sha-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = release ]; then tags="$tags,$img:${{ github.event.release.tag_name }},$img:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
