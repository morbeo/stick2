name: Server · test & image
run-name: "${{ github.event_name == 'release' && format('Server image {0}', github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && 'Server image (manual)' || format('Server tests on {0}', github.ref_name) }}"

# Tests the dedicated server (server/) on every change to it; builds the multi-arch Docker image and pushes it to GHCR
# (ghcr.io/<owner>/stick2-server) on a release or by hand.
on:
  push:
    branches: [master] # branches are covered by their PR run; avoids testing every push twice
    paths: ["server/**", "src/net/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "src/net/**", ".github/workflows/server.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # server/package.json engines
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Run server tests
        run: |
          npm test --prefix server
          echo "Server tests passed on \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build and push image
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          img="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/stick2-server"
          tags="$img:sha-${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = release ]; then tags="$tags,$img:${{ github.event.release.tag_name }},$img:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          build-args: COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
